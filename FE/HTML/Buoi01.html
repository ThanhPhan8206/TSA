<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keyword" content="HTML, CSS"> <!--Keyword để tìm kiếm trang-->
    <meta name="description" content="Đây là khóa học FE">
    <meta name="author" content="Phan Hữu Thành">

    <title>Tôi đang học FE</title>

</head>
<body>
    <h2>Chọn bài học Wikipedia:</h2>
    
    <!-- Các thẻ a với target trỏ vào name của iframe -->
    <a href="https://vi.wikipedia.org/wiki/HTML" target="khung_hien_thi">Đọc về HTML</a> | 
    <a href="https://vi.wikipedia.org/wiki/CSS" target="khung_hien_thi">Đọc về CSS</a> |
    <a href="https://vi.wikipedia.org/wiki/JavaScript" target="khung_hien_thi">Đọc về JavaScript</a>

    <br><br>

    <!-- Iframe được đặt tên là "khung_hien_thi" -->
    <iframe 
        name="khung_hien_thi" 
        src="https://vi.wikipedia.org/wiki/HTML" 
        width="800" 
        height="500" 
        style="border: 2px solid blue;">
    </iframe>

    <iframe src="https://www.google.com/maps/embed?pb=!4v1786558468403!6m8!1m7!1sJ3dohNa-2eppPDvPo8YuBg!2m2!1d20.9663506402225!2d105.7789907806412!3f133.64075821554567!4f2.8850613995036696!5f0.7820865974627469" 
        width="600" height="450" style="border:0;" 
        allowfullscreen="" loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>

</body>
</html>
